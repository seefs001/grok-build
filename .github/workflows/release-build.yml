# Every push publishes downloadable release binaries.
# `--release`, not `release-dist`: that profile is about 2.2x slower, and this
# runs on every push. A newer push to the same branch cancels the in-flight run.
name: Release build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: ubuntu-24.04
            name: Linux

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev cmake unzip

      - name: Point macOS at Homebrew OpenSSL
        if: runner.os == 'macOS'
        run: |
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          echo "OPENSSL_DIR=${prefix}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}" >> "$GITHUB_ENV"

      - name: Install protoc 29.3
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) asset=protoc-29.3-osx-aarch_64.zip ;;
            Darwin-x86_64) asset=protoc-29.3-osx-x86_64.zip ;;
            Linux-x86_64) asset=protoc-29.3-linux-x86_64.zip ;;
            Linux-aarch64) asset=protoc-29.3-linux-aarch_64.zip ;;
            *) echo "no protoc asset for $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/${asset}"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      # Keep in step with rust-toolchain.toml. The extra Linux targets listed
      # there are not required; this job builds the runner's host triple.
      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true

      - name: Build release binary
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
        run: cargo build -p xai-grok-pager-bin --release --locked

      - name: Package
        id: package
        run: |
          set -euo pipefail
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) triple=aarch64-apple-darwin ;;
            Darwin-x86_64) triple=x86_64-apple-darwin ;;
            Linux-x86_64) triple=x86_64-unknown-linux-gnu ;;
            Linux-aarch64) triple=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported host $(uname -s)-$(uname -m)" >&2; exit 1 ;;
          esac
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" dist
          cp target/release/xai-grok-pager "$stage/grok"
          chmod 755 "$stage/grok"
          if [ "$(uname -s)" = "Darwin" ]; then
            strip -Sx "$stage/grok"
          else
            strip --strip-unneeded "$stage/grok"
          fi
          tar -C "$stage" -czf "dist/grok-${triple}.tar.gz" grok
          echo "triple=${triple}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: grok-${{ steps.package.outputs.triple }}
          path: dist/grok-${{ steps.package.outputs.triple }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          pattern: grok-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/grok-*.tar.gz)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no archives were built" >&2
            exit 1
          fi
          (cd dist && sha256sum grok-*.tar.gz > SHA256SUMS)

          tag="build-${GITHUB_SHA}"
          short="${GITHUB_SHA:0:7}"
          title="${GITHUB_REF_NAME} @ ${short}"
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo
            echo "每个压缩包里是一个名为 \`grok\` 的可执行文件，由 \`cargo build -p xai-grok-pager-bin --release --locked\` 打出。"
            echo
            echo "最近一次 **main** 构建可以直接下载。"
            echo
            echo "macOS (Apple Silicon)"
            echo
            echo "\`\`\`sh"
            echo "curl -fsSL -o grok.tar.gz https://github.com/${GH_REPO}/releases/latest/download/grok-aarch64-apple-darwin.tar.gz"
            echo "tar -xzf grok.tar.gz"
            echo "\`\`\`"
            echo
            echo "Linux (x86_64)"
            echo
            echo "\`\`\`sh"
            echo "curl -fsSL -o grok.tar.gz https://github.com/${GH_REPO}/releases/latest/download/grok-x86_64-unknown-linux-gnu.tar.gz"
            echo "tar -xzf grok.tar.gz"
            echo "\`\`\`"
            echo
            echo "这一次提交的 tag 是 \`${tag}\`。其他分支不会覆盖上面的 latest 链接。"
            echo
            echo "\`\`\`sh"
            echo "gh release download ${tag} --repo ${GH_REPO} --pattern 'grok-*.tar.gz'"
            echo "\`\`\`"
          } > "$notes"

          # GitHub rejects marking a prerelease as Latest. main is a normal
          # release so /releases/latest/download/ works; other branches stay prereleases.
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            kind_args=(--latest --prerelease=false)
          else
            kind_args=(--latest=false --prerelease)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/grok-*.tar.gz dist/SHA256SUMS --clobber
            gh release edit "$tag" --title "$title" --notes-file "$notes" "${kind_args[@]}"
          else
            gh release create "$tag" dist/grok-*.tar.gz dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$notes" \
              "${kind_args[@]}"
          fi
